<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little surprise ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fce8ee;
    color: #785663;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    background: #bd879b;
    border-radius: 50%;
    opacity: 0.4;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.15; }
    to { opacity: 0.65; }
}

#opening,
#surprise {
    position: relative;
    z-index: 1;
}

#opening {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.intro {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    color: #936b7b;
    margin-bottom: 35px;
    font-style: italic;
}

.envelope {
    font-size: 65px;
    margin-bottom: 30px;
    color: #b77f94;
}

button {
    background: rgba(255,255,255,0.3);
    border: 1px solid #c997aa;
    color: #916577;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #e8c4d1;
    color: #704b5a;
}

#surprise {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;
}

canvas {
    width: min(340px, 90vw);
    height: 340px;
}

.message {
    max-width: 330px;
    margin-top: 20px;
    color: #956d7e;
    font-family: 'Cormorant Garamond', serif;
    font-size: 25px;
    line-height: 1.5;
    font-style: italic;
}

.small-note {
    color: #b58b9b;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 35px;
    text-transform: uppercase;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<section id="opening">
    <p class="intro">Your Aani has a little surprise for youu...</p>

    <div class="envelope">✉</div>

    <button onclick="openSurprise()">
        OPEN YOUR SURPRISE &nbsp; ♡
    </button>
</section>

<section id="surprise">
    <canvas id="heartCanvas"></canvas>

    <p class="message">
        as longgg... as i exist<br>
        you will always be lovedd.
    </p>

    <p class="small-note">a little reminder, always ♡</p>
</section>

<script>

/* Background stars */

const stars = document.getElementById("stars");

for (let i = 0; i < 100; i++) {
    const star = document.createElement("div");
    star.className = "star";

    const size = Math.random() * 2 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";

    stars.appendChild(star);
}


/* Open surprise */

function openSurprise() {
    document.getElementById("opening").style.display = "none";
    document.getElementById("surprise").style.display = "flex";

    startHeart();
}


/* Minimal aesthetic heart */

function startHeart() {
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    const dpr = window.devicePixelRatio || 1;
    const width = 340;
    const height = 340;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.scale(dpr, dpr);

    let rotation = 0;

    function draw() {
        ctx.clearRect(0, 0, width, height);

        rotation += 0.003;

        ctx.save();

        ctx.translate(width / 2, height / 2);
        ctx.rotate(Math.sin(rotation) * 0.025);

        ctx.beginPath();

        for (let t = 0; t <= Math.PI * 2; t += 0.01) {

            const x = 16 * Math.pow(Math.sin(t), 3);

            const y = -(13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t));

            const px = x * 7;
            const py = y * 7;

            if (t === 0) {
                ctx.moveTo(px, py);
            } else {
                ctx.lineTo(px, py);
            }
        }

        ctx.closePath();

        ctx.strokeStyle = "#b77f94";
        ctx.lineWidth = 1.3;
        ctx.stroke();

        ctx.fillStyle = "rgba(183, 127, 148, 0.08)";
        ctx.fill();

        ctx.fillStyle = "#936b7b";
        ctx.font = "500 19px 'Cormorant Garamond'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText("RIDS", 0, 5);

        ctx.restore();

        drawSparkle(75, 90, 4);
        drawSparkle(263, 220, 3);
        drawSparkle(250, 75, 2.5);
        drawSparkle(85, 245, 2);

        requestAnimationFrame(draw);
    }


    function drawSparkle(x, y, size) {
        ctx.save();

        ctx.translate(x, y);

        ctx.strokeStyle = "#b77f94";
        ctx.globalAlpha = 0.65;
        ctx.lineWidth = 0.8;

        ctx.beginPath();

        ctx.moveTo(-size, 0);
        ctx.lineTo(size, 0);

        ctx.moveTo(0, -size);
        ctx.lineTo(0, size);

        ctx.stroke();

        ctx.restore();
    }

    draw();
}

</script>

</body>
</html>
