    margin: 0;

}

    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #390018, #15000b, #000);
    color: white;
    font-family: Georgia, serif;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

@keyframes twinkle {

}

    filter: drop-shadow(0 0 20px #e96e87);
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

button {
    margin-top: 30px;
    padding: 13px 30px;
    border: 1px solid #fd6d93;
    border-radius: 30px;
    background: transparent;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #cb295f;
    box-shadow: 0 0 20px #bb3b55;
}

#reveal {
    display: none;
    margin-top: 30px;
    animation: appear 2s ease;
}

.heart {

}

@keyframes appear {

        transform: translateY(0);
    }
}
</style>
